services:
  podcast:
    build:
      context: ..
      dockerfile: pipeline-app/Dockerfile
    # Run as the host user so files written to ../data are owned by you
    # (not root), so you can edit/delete them without sudo. Override
    # PUID/PGID in .env on machines with a different host uid/gid.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    environment:
      # Required: the LLM/TTS gateway key the pipeline + podcastfy backend share.
      SKAINET_API_KEY: ${SKAINET_API_KEY}
      # Optional override (default shown). Model choices are pinned in code.
      LLM_API_BASE: ${LLM_API_BASE:-https://chat.model.tngtech.com/v1}
      # Non-root user has no writable home; point it somewhere it can cache.
      HOME: /tmp
    restart: unless-stopped
