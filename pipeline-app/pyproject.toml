[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-weekly-podcast"
version = "0.1.0"
description = "Collect AI research papers, rank them with an LLM judge, and turn the top picks into a podcast brief."
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies are pinned in requirements.txt and installed before the
# editable install (see Dockerfile: pip install -r requirements.txt first).
# The shared podcast_engine library is editable-installed separately.

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
ai-podcast = "pipeline.__main__:main"

[tool.setuptools]
packages = [
    "pipeline",
    "service",
]
