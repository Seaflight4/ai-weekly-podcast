[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-weekly-podcast"
version = "0.1.0"
description = "Collect AI research papers, rank them with an LLM judge, and turn the top picks into a podcast brief."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0.0",
    "trafilatura>=2.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
ai-podcast = "pipeline.__main__:main"

[tool.setuptools]
packages = ["pipeline"]
