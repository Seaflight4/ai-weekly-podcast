<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Weekly Podcast</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>AI Weekly Podcast</h1>
    <div class="header-right">
      <span id="schedule-info" class="muted">schedule: …</span>
      <label class="switch" title="Toggle the weekly auto-run">
        <input type="checkbox" id="schedule-toggle">
        <span class="slider"></span>
      </label>
      <button id="btn-new" title="Run collect → rank → generate now">Generate new episode</button>
    </div>
  </header>

  <details id="customize-box" class="customize-box">
    <summary>Customize episode</summary>
    <div class="cfg-grid">
      <label>Window start
        <input type="date" id="cfg-window-start">
      </label>
      <label>Window end
        <input type="date" id="cfg-window-end">
      </label>
      <label>Audience
        <select id="cfg-audience">
          <option value="researcher" selected>Researcher</option>
          <option value="intermediate">Intermediate</option>
          <option value="beginner">Beginner</option>
        </select>
      </label>
      <label>Familiar topics (comma-separated)
        <input type="text" id="cfg-familiar" placeholder="e.g. transformers, RLHF">
      </label>
      <label>Podcast length
        <select id="cfg-length">
          <option value="short">Short (~10 min)</option>
          <option value="medium" selected>Medium (15–20 min)</option>
          <option value="long">Long (~30 min)</option>
        </select>
      </label>
      <label>Topic depth
        <select id="cfg-depth">
          <option value="brief">Brief (~1 min/source)</option>
          <option value="deep-dive" selected>Deep-dive (~2 min/source)</option>
        </select>
      </label>
    </div>
    <p class="muted">Derived sources: <span id="cfg-sources">9</span> · est. <span id="cfg-minutes">18</span> min</p>
  </details>

  <main>
    <aside id="episode-list">
      <div class="list-tabs">
        <button data-tab="default" class="active">Default</button>
        <button data-tab="personalized">Personalized</button>
      </div>
      <ul id="episodes"></ul>
    </aside>

    <section id="detail">
      <p class="muted">Select an episode on the left.</p>
    </section>
  </main>

  <div id="run-panel" class="hidden">
    <div class="run-panel-head">
      <h3 id="run-title">Run in progress</h3>
      <button id="run-close" class="link">close</button>
    </div>
    <div class="progress">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="progress-meta" class="progress-meta">starting…</div>
    </div>
    <pre id="run-log"></pre>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
