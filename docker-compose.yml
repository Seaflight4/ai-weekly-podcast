services:
  podcast:
    build: .
    # Runs as root (image default) so the ./data bind mount is writable on
    # every machine (rootful/rootless Linux, Docker Desktop) without setup.
    # Episodes/config/logs land root-owned under ./data — fine for
    # container-only use. If you ever run the pipeline on the host instead,
    # point PIPELINE_DATA_ROOT at a separate directory.
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Required: the LLM/TTS gateway key the pipeline + podcastfy backend share.
      SKAINET_API_KEY: ${SKAINET_API_KEY}
      # Optional overrides (defaults shown).
      JUDGE_MODEL: ${JUDGE_MODEL:-Qwen/Qwen3.8-27B}
      LLM_API_BASE: ${LLM_API_BASE:-https://chat.model.tngtech.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
    restart: unless-stopped
