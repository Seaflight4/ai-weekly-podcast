services:
  podcast:
    build: .
    # Run as the host user so bind-mounted files in ./data are never
    # root-owned (root-owned leftovers break host-side pipeline runs).
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Required: the LLM/TTS gateway key the pipeline + podcastfy backend share.
      SKAINET_API_KEY: ${SKAINET_API_KEY}
      # Optional overrides (defaults shown).
      JUDGE_MODEL: ${JUDGE_MODEL:-Qwen/Qwen3.8-27B}
      LLM_API_BASE: ${LLM_API_BASE:-https://chat.model.tngtech.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
    restart: unless-stopped
