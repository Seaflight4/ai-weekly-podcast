services:
  podcast-mcp:
    build:
      context: ..
      dockerfile: mcp-app/Dockerfile
      # Build /app owned by the same uid/gid the container runs as, so the
      # engine's cwd-relative output/ dirs stay writable without root.
      args:
        APP_UID: ${PUID:-1000}
        APP_GID: ${PGID:-1000}
    # Run as the host user so files written to ./data (mcp-app/data) are owned
    # by you (not root), so you can edit/delete them without sudo. Override
    # PUID/PGID in .env on machines with a different host uid/gid.
    user: "${PUID:-1000}:${PGID:-1000}"
    command: python -m mcp_server
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    environment:
      # Required: the LLM/TTS gateway key both the engine's transcript LLM and
      # the TNG qwen3 TTS backend share.
      SKAINET_API_KEY: ${SKAINET_API_KEY}
      # Optional override (default shown). Model choices are pinned in code.
      LLM_API_BASE: ${LLM_API_BASE:-https://chat.model.tngtech.com/v1}
      # Non-root user has no writable home; point it somewhere it can cache.
      HOME: /tmp
      MCP_PORT: "8001"
      MCP_HOST: "0.0.0.0"
    restart: unless-stopped
